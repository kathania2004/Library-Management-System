# --- Server ---
server.port=8080

# --- MySQL connection ---
# Change lms_db, root, and yourpassword to match your local MySQL setup.
# You do NOT need to create the tables yourself - Hibernate does it for you (see ddl-auto below).
# You DO need to create the database itself first: run this once in MySQL -> CREATE DATABASE lms_db;
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update -> Hibernate creates/updates tables to match your @Entity classes automatically.
# Great for learning; in a real production app you'd use migration tools like Flyway instead.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs in your console - very useful for understanding what's happening
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
